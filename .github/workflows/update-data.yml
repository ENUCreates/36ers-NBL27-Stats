name: Rebuild NBL27 data (manual)

# The daily rebuild runs from the Claude scheduled task (8:58am Sydney) so the Claude page and this site
# always get the same verified data. This workflow is a manual backup only: Actions tab -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      settle_hours:
        description: "Only include games that tipped off at least this many hours ago"
        default: "8"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Full rebuild from ESPN with checks
        run: python3 nbl27-website-updater/updater/rebuild.py . "${{ github.event.inputs.settle_hours }}"

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- data; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Data rebuild $(TZ=Australia/Sydney date +%F)"
          git pull --rebase origin main
          git push origin main
